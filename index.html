<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Ульяна, это мы</title>
  <link rel="icon" href="favicon.ico">
  <style>
    :root {
      --night: #0c1322;
      --night-rise: #18243d;
      --ivory: #f6f1e8;
      --ivory-soft: #ddd6cb;
      --hint-night: #cfc7ba;
      --warm: #f4eadc;
      --warm-deep: #e8d8c4;
      --ink: #241c16;
      --ink-soft: #5c5146;
      --paper: rgba(255, 250, 244, 0.78);
      --brass: #c6a36a;
      --light: #ffe2b8;
      --serif: Georgia, "Iowan Old Style", Palatino, "Palatino Linotype", "Times New Roman", "Liberation Serif", serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Liberation Sans", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background:
        radial-gradient(ellipse at 50% 12%, var(--night-rise), var(--night) 58%);
      color: var(--ivory);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      transition: background 1.15s ease, color 1.15s ease;
    }

    body.is-open {
      background:
        radial-gradient(ellipse at 50% 0%, #fff8ee 0%, var(--warm) 46%, var(--warm-deep) 100%);
      color: var(--ink);
    }

    button {
      font-family: inherit;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.35rem;
      padding:
        max(1.15rem, env(safe-area-inset-top))
        1.25rem
        max(1.25rem, env(safe-area-inset-bottom));
    }

    .mast,
    .closed-copy,
    .open-copy {
      width: min(100%, 22.5rem);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .title {
      margin: 0;
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(2.7rem, 13vw, 4.6rem);
      line-height: 0.95;
      letter-spacing: -0.03em;
      text-align: center;
      color: var(--ivory);
      white-space: nowrap;
    }

    .date {
      margin: 0.7rem 0 0;
      font-size: 1.05rem;
      letter-spacing: 0.2em;
      color: var(--ivory-soft);
    }

    .hint {
      margin: 0 0 0.85rem;
      font-size: 1.05rem;
      line-height: 1.35;
      text-align: center;
      color: var(--hint-night);
    }

    .open-btn {
      appearance: none;
      width: 100%;
      min-height: 3.6rem;
      border: 0;
      border-radius: 999px;
      background: #f3e6d2;
      color: var(--ink);
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
    }

    .open-btn:active { transform: translateY(1px); }

    .open-btn:focus-visible,
    .voice:focus-visible {
      outline: 2px solid var(--brass);
      outline-offset: 3px;
    }

    .doorway {
      position: relative;
      width: min(62vw, 200px);
      aspect-ratio: 3 / 5;
      padding: 7px;
      background: #090e18;
      box-shadow:
        0 0 0 1px rgba(246, 241, 232, 0.16),
        0 22px 40px rgba(0, 0, 0, 0.32);
      transition: width 0.9s ease, box-shadow 1.15s ease;
    }

    .hinge {
      position: absolute;
      left: 1px;
      width: 4px;
      height: 16px;
      background: linear-gradient(#ead7b4, #8d7350);
      z-index: 3;
      pointer-events: none;
    }

    .hinge-top { top: 18%; }
    .hinge-bottom { bottom: 18%; }

    .opening {
      position: relative;
      height: 100%;
      perspective: 900px;
      perspective-origin: left center;
    }

    .interior {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 58% 38%, #fffaf2 0%, #f6e2c4 46%, #e7c89a 100%);
    }

    .family-frame,
    .family {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .family {
      display: block;
      object-fit: cover;
      object-position: center 42%;
      opacity: 0;
      transform: scale(1.06) translateY(10px);
    }

    .app.is-open .family {
      animation: familyIn 0.9s ease 0.16s both, familyBreathe 7.5s ease-in-out 1.1s infinite;
    }

    .interior::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 18%, rgba(255, 236, 210, 0.55), transparent 58%);
      opacity: 0;
    }

    .app.is-open .interior::after {
      animation: flicker 6.5s ease-in-out 1.1s infinite;
    }

    .decor {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .mast,
    .doorway,
    .closed-copy,
    .open-copy {
      position: relative;
      z-index: 1;
    }

    .orn {
      position: absolute;
      display: block;
      opacity: 0.22;
    }

    .orn.heart { fill: #f0d7b0; filter: drop-shadow(0 0 5px rgba(255, 214, 160, 0.55)); }
    .orn.spark { fill: #fff4df; filter: drop-shadow(0 0 4px rgba(255, 228, 190, 0.8)); }
    .orn.bloom,
    .orn.petal { opacity: 0; }

    .app.is-open .orn.heart { fill: #d98984; filter: none; opacity: 0.38; }
    .app.is-open .orn.spark { fill: #e7c9a2; filter: none; opacity: 0.28; }
    .app.is-open .orn.bloom,
    .app.is-open .orn.petal { opacity: 0.42; }
    .app.is-open .orn.bloom { fill: #e7b39a; }
    .app.is-open .orn.petal { fill: #f0d3b4; }

    .h1 { top: 7%; left: 6%; width: 18px; height: 16px; animation: drift 9s ease-in-out infinite; }
    .h2 { top: 16%; right: 7%; width: 12px; height: 11px; animation: drift 11s ease-in-out -2s infinite; }
    .h3 { top: 38%; left: 5%; width: 14px; height: 13px; animation: drift 10s ease-in-out -4s infinite; }
    .h4 { top: 46%; right: 6%; width: 16px; height: 14px; animation: drift 12s ease-in-out -1s infinite; }
    .s1 { top: 11%; right: 18%; width: 8px; height: 8px; animation: drift 8s ease-in-out -3s infinite; }
    .s2 { top: 28%; left: 14%; width: 7px; height: 7px; animation: drift 9.5s ease-in-out -5s infinite; }
    .s3 { top: 58%; right: 10%; width: 6px; height: 6px; animation: drift 10s ease-in-out -2.5s infinite; }
    .b1 { top: 24%; right: 8%; width: 22px; height: 22px; animation: drift 13s ease-in-out -1.5s infinite; }
    .b2 { top: 62%; left: 6%; width: 18px; height: 18px; animation: drift 12s ease-in-out -4s infinite; }
    .p1 { top: 33%; left: 8%; width: 14px; height: 14px; animation: drift 11s ease-in-out -6s infinite; }
    .p2 { top: 70%; right: 8%; width: 12px; height: 12px; animation: drift 10s ease-in-out -3s infinite; }

    .door {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transform-origin: left center;
      transition: transform 1.15s cubic-bezier(0.5, 0.02, 0.18, 1);
    }

    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
    }

    .front {
      background: linear-gradient(180deg, #1d273b 0%, #141c2e 100%);
      box-shadow: inset 0 0 0 1px rgba(246, 241, 232, 0.08);
    }

    .front::before {
      content: "";
      position: absolute;
      inset: 8% 9%;
      border: 1px solid rgba(246, 241, 232, 0.14);
    }

    .back {
      transform: rotateY(180deg);
      background: #101624;
    }

    .handle {
      position: absolute;
      right: 14%;
      top: 54%;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #f0ddb4, var(--brass) 55%, #8a6840);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35);
    }

    .light-edge {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 3px;
      background: var(--light);
      box-shadow:
        0 0 8px 1px rgba(255, 214, 160, 0.95),
        0 0 18px 4px rgba(255, 186, 110, 0.45);
    }

    .sill {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: -7px;
      height: 10px;
      background: radial-gradient(ellipse at center, rgba(255, 206, 140, 0.9), rgba(255, 206, 140, 0) 72%);
      filter: blur(0.5px);
      pointer-events: none;
      transition: opacity 0.45s ease;
    }

    .app.is-closed .open-copy { display: none; }

    .app.is-open .mast,
    .app.is-open .closed-copy { display: none; }

    .app.is-open {
      justify-content: safe center;
    }

    .app.is-open .doorway {
      width: min(72vw, 250px);
      box-shadow:
        0 0 0 1px rgba(36, 28, 22, 0.16),
        0 16px 28px rgba(80, 50, 20, 0.16);
    }

    .app.is-ringing .doorway { animation: knock 0.52s ease-in-out 3; }

    .app.is-ringing .light-edge { animation: glow 1.15s ease-in-out infinite; }

    .app.is-open .door { transform: rotateY(-108deg); }

    .app.is-open .light-edge,
    .app.is-open .sill { opacity: 0; }

    .app.is-open .open-copy {
      gap: 0.15rem;
      animation: appear 0.9s ease 0.12s both;
    }

    .greeting {
      margin: 0.15rem 0 0.85rem;
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(1.9rem, 7.4vw, 2.7rem);
      line-height: 1.18;
      letter-spacing: -0.02em;
      text-align: center;
      color: var(--ink);
    }

    .greeting .line { display: block; }

    .app.is-open .hint {
      margin-bottom: 0.75rem;
      color: var(--ink-soft);
    }

    .voices {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .voice {
      appearance: none;
      width: 100%;
      min-height: 4.25rem;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 0.85rem;
      padding: 0.9rem 1.1rem;
      border: 1px solid rgba(36, 28, 22, 0.14);
      border-radius: 14px;
      background: var(--paper);
      color: var(--ink);
      font-size: 1.375rem;
      font-weight: 600;
      letter-spacing: 0;
      text-align: left;
      cursor: pointer;
    }

    .voice .icon {
      width: 1.6rem;
      flex: 0 0 auto;
      font-size: 1.25rem;
      line-height: 1;
    }

    .voice .name { line-height: 1.1; }

    .voice[aria-pressed="true"] {
      background: #fffaf4;
      border-color: rgba(36, 28, 22, 0.38);
    }

    .voice:active { transform: translateY(1px); }

    @keyframes appear {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes knock {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-1.5px); }
      50% { transform: translateX(1.5px); }
      75% { transform: translateX(-0.75px); }
    }

    @keyframes glow {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }

    @keyframes familyIn {
      from { opacity: 0; transform: scale(1.07) translateY(12px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes familyBreathe {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.018) translateY(-3px); }
    }

    @keyframes flicker {
      0%, 100% { opacity: 0.12; }
      50% { opacity: 0.38; }
    }

    @keyframes drift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @media (max-height: 760px) {
      .app { gap: 0.85rem; }
      .doorway { width: min(52vw, 180px); }
      .app.is-open .doorway { width: min(66vw, 220px); }
      .voice { min-height: 3.5rem; padding-top: 0.7rem; padding-bottom: 0.7rem; }
    }

    @media (min-width: 800px) {
      body.is-open { overflow: hidden; }
      .app { gap: 1rem; }
      .app.is-open {
        gap: 0.7rem;
        padding-top: 0.85rem;
        padding-bottom: 0.85rem;
      }
      .title { font-size: 4.6rem; }
      .doorway { width: 220px; }
      .app.is-open .doorway { width: 210px; }
      .mast,
      .closed-copy,
      .open-copy { width: min(100%, 26rem); }
      .greeting { font-size: 2.8rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .door,
      .doorway,
      .light-edge,
      .sill,
      .open-btn,
      .voice,
      body {
        transition: none !important;
      }

      .app.is-open .open-copy,
      .app.is-open .family,
      .app.is-open .interior::after,
      .orn,
      .app.is-ringing .doorway,
      .app.is-ringing .light-edge {
        animation: none !important;
      }

      .app.is-open .family { opacity: 1; transform: none; }
      .app.is-open .interior::after { opacity: 0.2; }
    }
  </style>
</head>
<body>
  <main id="app" class="app is-closed" data-melody="idle" data-bell="idle" data-overlap="0" data-active-voice="">
    <div class="decor" aria-hidden="true">
      <svg class="orn heart h1" viewBox="0 0 32 30"><path d="M16 27 C6 18 2 12 8 7 C12 4 15 7 16 10 C17 7 20 4 24 7 C30 12 26 18 16 27 Z"/></svg>
      <svg class="orn heart h2" viewBox="0 0 32 30"><path d="M16 27 C6 18 2 12 8 7 C12 4 15 7 16 10 C17 7 20 4 24 7 C30 12 26 18 16 27 Z"/></svg>
      <svg class="orn heart h3" viewBox="0 0 32 30"><path d="M16 27 C6 18 2 12 8 7 C12 4 15 7 16 10 C17 7 20 4 24 7 C30 12 26 18 16 27 Z"/></svg>
      <svg class="orn heart h4" viewBox="0 0 32 30"><path d="M16 27 C6 18 2 12 8 7 C12 4 15 7 16 10 C17 7 20 4 24 7 C30 12 26 18 16 27 Z"/></svg>
      <svg class="orn spark s1" viewBox="0 0 16 16"><path d="M8 0 L9.2 6.8 L16 8 L9.2 9.2 L8 16 L6.8 9.2 L0 8 L6.8 6.8 Z"/></svg>
      <svg class="orn spark s2" viewBox="0 0 16 16"><path d="M8 0 L9.2 6.8 L16 8 L9.2 9.2 L8 16 L6.8 9.2 L0 8 L6.8 6.8 Z"/></svg>
      <svg class="orn spark s3" viewBox="0 0 16 16"><path d="M8 0 L9.2 6.8 L16 8 L9.2 9.2 L8 16 L6.8 9.2 L0 8 L6.8 6.8 Z"/></svg>
      <svg class="orn bloom b1" viewBox="0 0 32 32"><circle cx="16" cy="10" r="5"/><circle cx="22" cy="16" r="5"/><circle cx="16" cy="22" r="5"/><circle cx="10" cy="16" r="5"/><circle cx="16" cy="16" r="3.2" fill="#f6e7c4"/></svg>
      <svg class="orn bloom b2" viewBox="0 0 32 32"><circle cx="16" cy="10" r="5"/><circle cx="22" cy="16" r="5"/><circle cx="16" cy="22" r="5"/><circle cx="10" cy="16" r="5"/><circle cx="16" cy="16" r="3.2" fill="#f6e7c4"/></svg>
      <svg class="orn petal p1" viewBox="0 0 20 28"><ellipse cx="10" cy="14" rx="6" ry="12" transform="rotate(-28 10 14)"/></svg>
      <svg class="orn petal p2" viewBox="0 0 20 28"><ellipse cx="10" cy="14" rx="6" ry="12" transform="rotate(24 10 14)"/></svg>
    </div>
    <header class="mast">
      <h1 class="title" id="closed-title">Ульяна, 19</h1>
      <p class="date" id="date">22 ноября</p>
    </header>

    <div class="doorway" id="doorway">
      <span class="hinge hinge-top"></span>
      <span class="hinge hinge-bottom"></span>
      <div class="opening">
        <div class="interior">
          <picture class="family-frame">
            <source srcset="img/family.webp" type="image/webp">
            <img class="family" src="img/family.jpg" alt="Мама, Тая и папа с котом и лабрадором">
          </picture>
        </div>
        <div class="door" id="door">
          <div class="face front">
            <span class="handle"></span>
            <span class="light-edge"></span>
          </div>
          <div class="face back"></div>
        </div>
        <div class="sill"></div>
      </div>
    </div>

    <div class="closed-copy">
      <p class="hint" id="ring-hint">В дверь звонят</p>
      <button type="button" id="open-door" class="open-btn">Открыть дверь</button>
    </div>

    <section class="open-copy" id="open-panel">
      <h1 class="greeting" id="greeting"><span class="line">С днём рождения,</span> <span class="line">Ульяна!</span></h1>
      <p class="hint" id="listen-hint">Нажми, чтобы послушать</p>
      <div class="voices" id="voices">
        <button type="button" class="voice" data-file="mama" aria-pressed="false">
          <span class="icon" aria-hidden="true">▶️</span><span class="name">Мама</span>
        </button>
        <button type="button" class="voice" data-file="taya" aria-pressed="false">
          <span class="icon" aria-hidden="true">▶️</span><span class="name">Тая</span>
        </button>
        <button type="button" class="voice" data-file="papa" aria-pressed="false">
          <span class="icon" aria-hidden="true">▶️</span><span class="name">Папа</span>
        </button>
      </div>
    </section>
  </main>

  <audio id="mama" data-file="mama" preload="none">
    <source src="audio/mama.m4a" type="audio/mp4">
    <source src="audio/mama.mp3" type="audio/mpeg">
  </audio>
  <audio id="taya" data-file="taya" preload="none">
    <source src="audio/taya.m4a" type="audio/mp4">
    <source src="audio/taya.mp3" type="audio/mpeg">
  </audio>
  <audio id="papa" data-file="papa" preload="none">
    <source src="audio/papa.m4a" type="audio/mp4">
    <source src="audio/papa.mp3" type="audio/mpeg">
  </audio>

  <script>
    (function () {
      "use strict";

      var EIGHTH = 0.28;
      var ICON_PLAY = "▶️";
      var ICON_PAUSE = "⏸️";

      // Happy Birthday to You, public-domain melody in C major, one octave up.
      // sol sol la sol do ti | sol sol la sol re do | sol sol sol mi do ti la | fa fa mi do re do
      var MELODY = [
        ["G5", 1], ["G5", 1], ["A5", 2], ["G5", 2], ["C6", 2], ["B5", 4],
        ["G5", 1], ["G5", 1], ["A5", 2], ["G5", 2], ["D6", 2], ["C6", 4],
        ["G5", 1], ["G5", 1], ["G6", 2], ["E6", 2], ["C6", 2], ["B5", 2], ["A5", 4],
        ["F6", 1], ["F6", 1], ["E6", 2], ["C6", 2], ["D6", 2], ["C6", 4]
      ];

      var HARMONY = [
        "C", null, null, "C", "C", "G",
        "C", null, null, "C", "G", "C",
        "C", null, "C", "C", "Am", "G", "F",
        "F", null, "C", "C", "G", "C"
      ];

      var SEMI = {
        F3: -16, G3: -14, A3: -12, B3: -10,
        C4: -9, D4: -7, E4: -5, F4: -4, G4: -2, A4: 0, B4: 2,
        C5: 3, D5: 5, E5: 7, F5: 8, G5: 10, A5: 12, B5: 14,
        C6: 15, D6: 17, E6: 19, F6: 20, G6: 22
      };

      var CHORDS = {
        C: ["C4", "E4", "G4"],
        G: ["G3", "B3", "D4"],
        F: ["F3", "A3", "C4"],
        Am: ["A3", "C4", "E4"]
      };

      var app = document.getElementById("app");
      var openBtn = document.getElementById("open-door");
      var buttons = Array.prototype.slice.call(document.querySelectorAll(".voice"));

      var BELL_RINGS = 3;
      var BELL_GAP = 1.2;

      var opened = false;
      var ctx = null;
      var master = null;
      var bellBus = null;
      var bellNodes = [];
      var bellStarted = false;
      var bellCancelled = false;
      var bellTimer = 0;
      var melodyNodes = [];
      var melodyStarted = false;
      var melodyCancelled = false;
      var melodyGen = 0;
      var melodyEndTimer = 0;
      var audioGate = Promise.resolve();
      var activeFile = "";

      function freq(name) {
        return 440 * Math.pow(2, SEMI[name] / 12);
      }

      function connectVoice(osc, gain, when, stop) {
        osc.connect(gain);
        gain.connect(master);
        osc.start(when);
        osc.stop(stop);
        melodyNodes.push({ osc: osc, when: when });
      }

      function playBox(frequency, time, dur) {
        var partials = [1, 2.71, 5.4];
        var amps = [0.62, 0.24, 0.1];
        var stop = time + Math.max(0.32, dur * 1.25);
        for (var i = 0; i < partials.length; i++) {
          if (frequency * partials[i] > 4600) continue;
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(frequency * partials[i], time);
          var peak = Math.max(0.0002, 0.16 * amps[i]);
          gain.gain.setValueAtTime(0.0001, time);
          gain.gain.exponentialRampToValueAtTime(peak, time + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, stop);
          connectVoice(osc, gain, time, stop + 0.03);
        }
      }

      function playChord(name, time, dur) {
        var notes = CHORDS[name];
        if (!notes) return;
        for (var i = 0; i < notes.length; i++) {
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq(notes[i]), time);
          gain.gain.setValueAtTime(0.0001, time);
          gain.gain.exponentialRampToValueAtTime(0.03, time + 0.06);
          gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);
          connectVoice(osc, gain, time, time + dur + 0.04);
        }
      }

      function songLength() {
        var beats = 0;
        for (var i = 0; i < MELODY.length; i++) beats += MELODY[i][1];
        return beats * EIGHTH;
      }

      function scheduleSong(startTime) {
        var t = startTime;
        for (var i = 0; i < MELODY.length; i++) {
          var dur = MELODY[i][1] * EIGHTH;
          playBox(freq(MELODY[i][0]), t, dur);
          if (HARMONY[i]) playChord(HARMONY[i], t, Math.max(dur * 1.15, EIGHTH * 3));
          t += dur;
        }
      }

      function markOverlap() {
        var bellOn = app.dataset.bell === "playing";
        var otherOn = app.dataset.melody === "playing" || !!app.dataset.activeVoice;
        if (bellOn && otherOn) app.dataset.overlap = "1";
      }

      function strike(frequency, time, dur, volume) {
        var partials = [1, 2, 2.76];
        var amps = [1, 0.32, 0.16];
        for (var i = 0; i < partials.length; i++) {
          if (frequency * partials[i] > 4800) continue;
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(frequency * partials[i], time);
          var peak = Math.max(0.0002, volume * amps[i]);
          gain.gain.setValueAtTime(0.0001, time);
          gain.gain.exponentialRampToValueAtTime(peak, time + 0.008);
          gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);
          osc.connect(gain);
          gain.connect(bellBus);
          osc.start(time);
          osc.stop(time + dur + 0.04);
          bellNodes.push({ osc: osc, when: time });
        }
      }

      function playDingDong(time) {
        strike(freq("A5"), time, 0.24, 0.22);
        strike(freq("E5"), time + 0.17, 0.62, 0.2);
      }

      function startBell() {
        if (bellCancelled || bellStarted || opened || melodyStarted || melodyCancelled) return;
        if (!ctx || ctx.state !== "running" || !bellBus) return;
        bellStarted = true;
        app.dataset.bell = "playing";
        app.classList.add("is-ringing");
        var t0 = ctx.currentTime + 0.02;
        for (var r = 0; r < BELL_RINGS; r++) playDingDong(t0 + r * BELL_GAP);
        bellTimer = window.setTimeout(function () {
          if (bellCancelled) return;
          app.classList.remove("is-ringing");
          app.dataset.bell = "done";
        }, (BELL_RINGS - 1) * BELL_GAP * 1000 + 900);
        markOverlap();
      }

      function stopBell() {
        bellCancelled = true;
        if (bellTimer) {
          window.clearTimeout(bellTimer);
          bellTimer = 0;
        }
        app.classList.remove("is-ringing");
        if (ctx && bellBus) {
          var now = ctx.currentTime;
          try {
            bellBus.gain.cancelScheduledValues(now);
            bellBus.gain.setValueAtTime(0.00001, now);
          } catch (err) {}
        }
        for (var i = 0; i < bellNodes.length; i++) {
          var item = bellNodes[i];
          var when = item.when > ctx.currentTime ? item.when + 0.001 : ctx.currentTime;
          try { item.osc.stop(when); } catch (err) {}
          try { item.osc.disconnect(); } catch (err) {}
        }
        bellNodes = [];
        if (bellStarted) app.dataset.bell = "stopped";
      }

      function ensureAudio() {
        if (ctx && master && ctx.state !== "closed") return true;
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        try {
          ctx = new AC();
          master = ctx.createGain();
          master.gain.value = 0.85;
          master.connect(ctx.destination);
          bellBus = ctx.createGain();
          bellBus.connect(master);
        } catch (err) {
          ctx = null;
          master = null;
          bellBus = null;
          return false;
        }
        return true;
      }

      function beginMelody() {
        stopBell();
        if (!ctx || !master || ctx.state === "closed") return;
        var token = ++melodyGen;
        melodyStarted = true;
        var start = function () {
          if (token !== melodyGen || !ctx || ctx.state === "closed") return;
          try {
            master.gain.cancelScheduledValues(ctx.currentTime);
            master.gain.setValueAtTime(0.85, ctx.currentTime);
          } catch (err) {}
          scheduleSong(ctx.currentTime + 0.06);
          app.dataset.melody = "playing";
          markOverlap();
          if (melodyEndTimer) window.clearTimeout(melodyEndTimer);
          melodyEndTimer = window.setTimeout(function () {
            if (token !== melodyGen) return;
            if (app.dataset.melody === "playing") app.dataset.melody = "done";
          }, songLength() * 1000 + 200);
        };
        var go = function () {
          if (token !== melodyGen || !ctx) return;
          if (ctx.state === "suspended") {
            var resumed = ctx.resume();
            if (resumed && resumed.then) resumed.then(start, start);
            else start();
          } else start();
        };
        if (audioGate && audioGate.then) audioGate.then(go, go);
        else go();
      }

      function stopMelody() {
        melodyGen += 1;
        melodyStarted = false;
        melodyCancelled = true;
        if (melodyEndTimer) {
          window.clearTimeout(melodyEndTimer);
          melodyEndTimer = 0;
        }
        if (ctx && master && ctx.state !== "closed") {
          var now = ctx.currentTime;
          try {
            master.gain.cancelScheduledValues(now);
            master.gain.setValueAtTime(0.00001, now);
          } catch (err) {}
          for (var i = 0; i < melodyNodes.length; i++) {
            var item = melodyNodes[i];
            var when = item.when > now ? item.when + 0.001 : now;
            try { item.osc.stop(when); } catch (err) {}
            try { item.osc.disconnect(); } catch (err) {}
          }
          melodyNodes = [];
          if (ctx.state === "running") {
            try { audioGate = ctx.suspend(); } catch (err) {}
          }
        }
        app.dataset.melody = "stopped";
      }

      function anyVoicePlaying() {
        for (var i = 0; i < buttons.length; i++) {
          var audio = voiceAudio(buttons[i]);
          if (audio && !audio.paused && !audio.ended) return true;
        }
        return false;
      }

      function preferredSource(audio) {
        var options = audio.querySelectorAll("source");
        var last = "";
        for (var i = 0; i < options.length; i++) {
          var src = options[i].getAttribute("src") || "";
          var type = options[i].getAttribute("type") || "";
          last = src;
          var support = audio.canPlayType(type);
          if (support === "probably" || support === "maybe") return src;
        }
        return last;
      }

      function assignSources() {
        var audios = document.querySelectorAll("audio[data-file]");
        for (var i = 0; i < audios.length; i++) {
          var chosen = preferredSource(audios[i]);
          if (chosen) audios[i].src = chosen;
        }
      }

      function setIcon(button, playing) {
        var icon = button.querySelector(".icon");
        icon.textContent = playing ? ICON_PAUSE : ICON_PLAY;
        button.setAttribute("aria-pressed", playing ? "true" : "false");
      }

      function voiceAudio(button) {
        return document.getElementById(button.getAttribute("data-file"));
      }

      function stopOthers(current) {
        for (var i = 0; i < buttons.length; i++) {
          var audio = voiceAudio(buttons[i]);
          if (audio === current) continue;
          if (!audio.paused) audio.pause();
          try { audio.currentTime = 0; } catch (err) {}
          setIcon(buttons[i], false);
        }
      }

      function onVoice(button) {
        var audio = voiceAudio(button);
        var file = button.getAttribute("data-file");
        var shouldPause = !audio.paused;
        stopBell();
        stopMelody();
        stopOthers(audio);
        if (shouldPause) {
          activeFile = "";
          audio.pause();
          setIcon(button, false);
          app.dataset.activeVoice = "";
          beginMelody();
          return;
        }
        activeFile = file;
        setIcon(button, true);
        app.dataset.activeVoice = file;
        markOverlap();
        var pending = audio.play();
        if (pending && pending.catch) {
          pending.catch(function () {
            if (activeFile !== file) return;
            activeFile = "";
            setIcon(button, false);
            app.dataset.activeVoice = "";
          });
        }
      }

      function watchAudio(button) {
        var audio = voiceAudio(button);
        var file = button.getAttribute("data-file");
        audio.addEventListener("play", function () {
          if (activeFile !== file) {
            audio.pause();
            setIcon(button, false);
            return;
          }
          setIcon(button, true);
          app.dataset.activeVoice = file;
        });
        audio.addEventListener("pause", function () {
          if (activeFile === file && !audio.ended) return;
          setIcon(button, false);
          if (app.dataset.activeVoice === file) app.dataset.activeVoice = "";
        });
        audio.addEventListener("ended", function () {
          setIcon(button, false);
          try { audio.pause(); } catch (err) {}
          try { audio.currentTime = 0; } catch (err) {}
          if (activeFile === file) activeFile = "";
          if (app.dataset.activeVoice === file) app.dataset.activeVoice = "";
          if (!anyVoicePlaying()) beginMelody();
        });
      }

      function warmVoices() {
        var audios = document.querySelectorAll("audio[data-file]");
        for (var i = 0; i < audios.length; i++) {
          audios[i].preload = "auto";
          try { audios[i].load(); } catch (err) {}
        }
      }

      function openDoor() {
        if (opened) return;
        opened = true;
        stopBell();
        app.classList.remove("is-closed");
        app.classList.add("is-open");
        document.body.classList.add("is-open");
        warmVoices();
        if (!ensureAudio()) return;
        var resumed = ctx.resume();
        if (resumed && resumed.then) resumed.then(beginMelody, beginMelody);
        else beginMelody();
      }

      function onAnywhere(event) {
        if (bellCancelled || bellStarted || opened) return;
        if (event.target && event.target.closest && event.target.closest("#open-door")) return;
        if (!ensureAudio()) return;
        var resumed = ctx.resume();
        var go = function () {
          if (bellCancelled || opened || bellStarted) return;
          if (ctx.state === "running") startBell();
        };
        if (resumed && resumed.then) resumed.then(go, function () {});
        else go();
      }

      function tryAutoplay() {
        if (!ensureAudio()) return;
        var resumed = ctx.resume();
        var go = function () {
          if (bellCancelled || opened || bellStarted) return;
          if (ctx && ctx.state === "running") startBell();
        };
        if (resumed && resumed.then) resumed.then(go, function () {});
        else go();
      }

      assignSources();
      document.addEventListener("pointerdown", onAnywhere, true);
      document.addEventListener("click", onAnywhere, true);
      tryAutoplay();
      for (var i = 0; i < buttons.length; i++) {
        watchAudio(buttons[i]);
        buttons[i].addEventListener("click", function (event) {
          onVoice(event.currentTarget);
        });
      }
      openBtn.addEventListener("click", openDoor);
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Ульяна, с днём рождения!</title>
  <style>
    :root {
      --ink: #5c382f;
      --rose: #8d2f45;
      --cream: #fff8f0;
      --wall-top: #f8dcc0;
      --wall-bot: #e7b58a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #e7b58a;
      color: var(--ink);
      font-family: system-ui, "Noto Sans", "Segoe UI", sans-serif;
    }

    button { font-family: inherit; }

    .app {
      position: relative;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255, 244, 220, 0.95), transparent 58%),
        linear-gradient(180deg, var(--wall-top) 0%, #f0c8a0 52%, var(--wall-bot) 100%);
    }

    .hall {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6.2rem 0.75rem 4.4rem;
    }

    .title {
      position: absolute;
      top: max(0.65rem, env(safe-area-inset-top));
      left: 0.7rem;
      right: 0.7rem;
      z-index: 5;
      margin: 0;
      text-align: center;
      font-family: "Noto Serif", Georgia, "Times New Roman", serif;
      font-size: clamp(1.45rem, 6.6vw, 2.65rem);
      font-weight: 700;
      line-height: 1.22;
      letter-spacing: 0.01em;
      color: var(--rose);
      text-wrap: balance;
      text-shadow: 0 2px 0 rgba(255, 248, 240, 0.45);
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.7s ease 0.35s, transform 0.7s ease 0.35s;
      pointer-events: none;
    }

    .app.is-open .title {
      opacity: 1;
      transform: none;
    }

    .scene {
      position: relative;
      width: min(100%, 460px);
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .doorway {
      position: relative;
      width: min(72vw, calc((100dvh - 10.6rem) * 0.56), 340px);
      aspect-ratio: 280 / 480;
      padding: 4.8% 5.2% 4.2%;
      border-radius: 16px;
      background: linear-gradient(180deg, #a56b49 0%, #7a4632 40%, #623828 100%);
      box-shadow:
        0 18px 40px rgba(80, 40, 18, 0.28),
        inset 0 0 0 3px rgba(255, 220, 180, 0.38),
        inset 0 0 0 8px #8a5340;
    }

    .hinge {
      position: absolute;
      left: 1.2%;
      width: 3.6%;
      height: 8%;
      border-radius: 3px;
      background: linear-gradient(90deg, #f3dd9a, #c79a45 55%, #8d6a2e);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.4) inset;
      z-index: 6;
      pointer-events: none;
    }

    .hinge-top { top: 16%; }
    .hinge-bottom { bottom: 18%; }

    .opening {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 6px;
      perspective: 1100px;
      perspective-origin: left center;
    }

    .interior {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: 6px;
      background: #ffd8b4;
    }

    .room {
      display: block;
      width: 100%;
      height: 100%;
    }

    .door-shake {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }

    .doorway.is-shaking {
      animation: doorShake 0.48s ease-in-out;
    }

    .door:disabled {
      opacity: 1;
    }

    .door {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 1.45s cubic-bezier(0.5, 0.02, 0.18, 1);
      cursor: default;
    }

    .app.is-closed .door { cursor: pointer; }

    .app.is-open .door { transform: rotateY(-108deg); }

    .door-front,
    .door-back {
      position: absolute;
      inset: 0;
      border-radius: 5px;
      overflow: hidden;
      backface-visibility: hidden;
    }

    .door-front {
      background: #c17d49;
      box-shadow: inset 0 0 0 2px rgba(90, 40, 20, 0.25);
    }

    .door-back {
      transform: rotateY(180deg);
      background:
        linear-gradient(90deg, #d7a56e, #e4bc88 18%, #c9925a 100%);
    }

    .back-panel {
      position: absolute;
      left: 12%;
      right: 12%;
      border-radius: 8px;
      background: rgba(120, 64, 30, 0.13);
      box-shadow: inset 0 0 0 2px rgba(90, 48, 24, 0.18);
    }

    .back-panel-a { top: 10%; height: 34%; }
    .back-panel-b { top: 50%; height: 38%; }

    .door svg { display: block; width: 100%; height: 100%; }

    .sill-light {
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: -1px;
      height: 10px;
      border-radius: 0 0 8px 8px;
      background: radial-gradient(ellipse at center, rgba(255, 214, 120, 0.95), rgba(255, 180, 80, 0) 72%);
      filter: blur(1px);
      z-index: 5;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .app.is-open .sill-light { opacity: 0; }

    .glow {
      position: absolute;
      inset: -6%;
      border-radius: 10px;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(ellipse at center, rgba(255, 214, 130, 0.15), rgba(255, 196, 90, 0.85) 64%, transparent 74%);
    }

    .app.is-closed .glow {
      animation: invite 1.7s ease-in-out infinite;
    }

    .plant {
      position: absolute;
      left: 0;
      bottom: -6px;
      width: min(18vw, 78px);
      height: auto;
      z-index: 4;
      pointer-events: none;
    }

    .bell-wrap {
      position: absolute;
      right: 0;
      top: 16%;
      width: 52px;
      height: 64px;
      z-index: 4;
      transform-origin: 50% 12%;
      pointer-events: none;
    }

    .bell-wrap.is-wiggling { animation: bellWiggle 0.55s ease-in-out; }

    .bell-wrap svg { display: block; width: 100%; height: 100%; }

    .mat {
      position: absolute;
      left: 50%;
      bottom: -18px;
      width: 46%;
      height: 16px;
      transform: translateX(-50%);
      border-radius: 40%;
      background:
        repeating-linear-gradient(90deg, #c45b58 0 8px, #f3d2b0 8px 14px);
      box-shadow: 0 4px 0 rgba(120, 60, 40, 0.15);
      z-index: 3;
    }

    .hint {
      display: none;
      position: absolute;
      left: 50%;
      bottom: max(0.85rem, env(safe-area-inset-bottom));
      z-index: 6;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      transform: translateX(-50%);
      cursor: pointer;
    }

    .app.is-closed .hint { display: block; }

    .hint-text {
      display: inline-block;
      padding: 0.55rem 1rem;
      border-radius: 999px;
      background: var(--cream);
      color: var(--ink);
      font-size: clamp(1rem, 4.4vw, 1.28rem);
      font-weight: 650;
      letter-spacing: 0.01em;
      box-shadow: 0 8px 20px rgba(90, 50, 30, 0.16);
      white-space: nowrap;
    }

    .app.is-closed .hint-text { animation: pulse 1.7s ease-in-out infinite; }

    .start-screen {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0 1rem max(11vh, 4.5rem);
      border: 0;
      cursor: pointer;
      background: linear-gradient(180deg, rgba(42, 20, 16, 0.38) 0%, rgba(42, 20, 16, 0.5) 46%, rgba(28, 12, 10, 0.7) 100%);
      color: var(--cream);
    }

    .app:not(.is-start) .start-screen { display: none; }

    .start-prompt {
      display: inline-block;
      padding: 0.85rem 1.15rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 248, 240, 0.45);
      background: rgba(255, 248, 240, 0.14);
      font-size: clamp(1.25rem, 5.4vw, 1.7rem);
      font-weight: 650;
      letter-spacing: 0.01em;
      text-shadow: 0 2px 10px rgba(40, 16, 10, 0.35);
    }

    .app.is-start .start-prompt { animation: pulse 1.8s ease-in-out infinite; }

    .mute {
      position: absolute;
      top: max(0.6rem, env(safe-area-inset-top));
      right: 0.6rem;
      z-index: 25;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(120, 70, 50, 0.18);
      background: rgba(255, 248, 240, 0.94);
      box-shadow: 0 6px 16px rgba(80, 40, 20, 0.16);
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
    }

    .app.is-start .mute {
      visibility: hidden;
      pointer-events: none;
    }

    .confetti {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 7;
      opacity: 0;
    }

    .app.is-open .confetti { opacity: 1; }

    .confetti i {
      position: absolute;
      top: -12%;
      width: 8px;
      height: 12px;
      border-radius: 2px;
      opacity: 0.95;
    }

    .app.is-open .confetti i { animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite; }

    .confetti i:nth-child(odd) { border-radius: 80% 0 80% 0; width: 10px; height: 14px; }
    .confetti i:nth-child(3n) { border-radius: 50%; width: 8px; height: 8px; }

    .confetti i:nth-child(1) { left: 6%; background: #ff8fab; animation-duration: 4.6s; animation-delay: 0s; }
    .confetti i:nth-child(2) { left: 14%; background: #ffd166; animation-duration: 5.2s; animation-delay: 0.4s; }
    .confetti i:nth-child(3) { left: 22%; background: #fff4c2; animation-duration: 4.2s; animation-delay: 0.15s; }
    .confetti i:nth-child(4) { left: 31%; background: #d7b3ff; animation-duration: 5.4s; animation-delay: 0.8s; }
    .confetti i:nth-child(5) { left: 40%; background: #ffb38a; animation-duration: 4.8s; animation-delay: 0.25s; }
    .confetti i:nth-child(6) { left: 48%; background: #9ad7cf; animation-duration: 5.1s; animation-delay: 1s; }
    .confetti i:nth-child(7) { left: 57%; background: #ff8fab; animation-duration: 4.4s; animation-delay: 0.55s; }
    .confetti i:nth-child(8) { left: 66%; background: #ffd166; animation-duration: 5.6s; animation-delay: 0.1s; }
    .confetti i:nth-child(9) { left: 74%; background: #f7c1d8; animation-duration: 4.9s; animation-delay: 0.7s; }
    .confetti i:nth-child(10) { left: 82%; background: #fff4c2; animation-duration: 5.3s; animation-delay: 0.33s; }
    .confetti i:nth-child(11) { left: 90%; background: #d7b3ff; animation-duration: 4.5s; animation-delay: 1.1s; }
    .confetti i:nth-child(12) { left: 18%; background: #ffb38a; animation-duration: 5.8s; animation-delay: 1.4s; }
    .confetti i:nth-child(13) { left: 36%; background: #ff8fab; animation-duration: 4.7s; animation-delay: 1.6s; }
    .confetti i:nth-child(14) { left: 52%; background: #9ad7cf; animation-duration: 5s; animation-delay: 0.9s; }
    .confetti i:nth-child(15) { left: 70%; background: #ffd166; animation-duration: 4.3s; animation-delay: 1.8s; }
    .confetti i:nth-child(16) { left: 86%; background: #f7c1d8; animation-duration: 5.5s; animation-delay: 0.6s; }

    .dancer {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: sway 2.4s ease-in-out infinite;
    }

    .dancer-mom { animation-duration: 2.35s; }
    .dancer-dad { animation-duration: 2.7s; animation-delay: -0.4s; }
    .dancer-sister { animation-duration: 2.15s; animation-delay: -0.8s; }
    .dancer-dog { animation-duration: 1.7s; animation-delay: -0.2s; }
    .dancer-cat { animation-duration: 2.55s; animation-delay: -1.1s; }

    .dog-tail {
      transform-box: fill-box;
      transform-origin: 12% 100%;
      animation: wag 0.42s ease-in-out infinite;
    }

    .balloon {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: floaty 3.4s ease-in-out infinite;
    }

    .balloon-b { animation-delay: -1.2s; animation-duration: 3.8s; }
    .balloon-c { animation-delay: -0.6s; animation-duration: 3.1s; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.88; }
      50% { transform: scale(1.055); opacity: 1; }
    }

    @keyframes doorShake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      18% { transform: translateX(-3px) rotate(-0.7deg); }
      36% { transform: translateX(3px) rotate(0.7deg); }
      54% { transform: translateX(-2px) rotate(-0.35deg); }
      72% { transform: translateX(2px) rotate(0.3deg); }
    }

    @keyframes bellWiggle {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-16deg); }
      45% { transform: rotate(13deg); }
      68% { transform: rotate(-8deg); }
      86% { transform: rotate(4deg); }
    }

    @keyframes invite {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.85; }
    }

    @keyframes sway {
      0%, 100% { transform: translateY(0) rotate(-2.2deg); }
      50% { transform: translateY(-7px) rotate(2.2deg); }
    }

    @keyframes wag {
      0%, 100% { transform: rotate(16deg); }
      50% { transform: rotate(-18deg); }
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes fall {
      0% { transform: translate3d(0, -10vh, 0) rotate(0deg); }
      100% { transform: translate3d(16px, 115vh, 0) rotate(320deg); }
    }

    @media (min-width: 900px) {
      .plant { left: 2%; width: 92px; }
      .bell-wrap { right: 2%; width: 58px; height: 72px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .start-prompt,
      .hint-text,
      .dancer,
      .dog-tail,
      .balloon,
      .confetti i,
      .glow,
      .doorway.is-shaking,
      .bell-wrap.is-wiggling {
        animation: none !important;
      }

      .door,
      .title,
      .sill-light {
        transition: none !important;
      }

      .confetti { display: none; }
    }
  </style>
</head>
<body>
  <div id="app" class="app is-start">
    <div class="hall">
      <h1 id="title" class="title" aria-hidden="true">Ульяна, с днём рождения! 🎉</h1>
      <div class="scene">
        <svg class="plant" viewBox="0 0 80 110" aria-hidden="true">
          <ellipse cx="40" cy="104" rx="26" ry="5" fill="rgba(90,50,30,0.15)"/>
          <path d="M26 100 L30 62 H50 L54 100 Z" fill="#e07a4a"/>
          <path d="M28 100 H52 L50 92 H30 Z" fill="#c4623c"/>
          <path d="M40 64 C28 50 18 58 22 36" fill="none" stroke="#3e8f4e" stroke-width="3" stroke-linecap="round"/>
          <ellipse cx="20" cy="34" rx="10" ry="6" fill="#5cb86a" transform="rotate(-30 20 34)"/>
          <ellipse cx="34" cy="28" rx="11" ry="6" fill="#3e9a55" transform="rotate(-10 34 28)"/>
          <ellipse cx="48" cy="36" rx="10" ry="6" fill="#6ec87a" transform="rotate(24 48 36)"/>
          <circle cx="40" cy="22" r="7" fill="#ff8fab"/>
          <circle cx="40" cy="22" r="3" fill="#ffd166"/>
        </svg>

        <div class="doorway" id="doorway">
          <span class="hinge hinge-top" aria-hidden="true"></span>
          <span class="hinge hinge-bottom" aria-hidden="true"></span>
          <div class="opening">
            <div class="interior">
              <svg class="room" viewBox="0 0 280 480" role="img" aria-label="Мама, папа, старшая сестра, лабрадор и светлая кошка с полосатым хвостом, все с цветами">
                <defs>
                  <linearGradient id="roomWall" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#fff3dc"/>
                    <stop offset="1" stop-color="#ffd0ae"/>
                  </linearGradient>
                  <linearGradient id="roomFloor" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#efc08a"/>
                    <stop offset="1" stop-color="#d39258"/>
                  </linearGradient>
                </defs>
                <rect width="280" height="480" fill="url(#roomWall)"/>
                <rect y="398" width="280" height="82" fill="url(#roomFloor)"/>
                <path d="M0 398 H280" stroke="#c4844e" stroke-width="3"/>
                <path d="M40 398 V480 M90 398 V480 M150 398 V480 M210 398 V480 M255 398 V480" stroke="rgba(140,80,40,0.18)" stroke-width="2"/>
                <ellipse cx="140" cy="418" rx="108" ry="16" fill="#e37b86"/>
                <ellipse cx="140" cy="418" rx="78" ry="10" fill="#f2b3b6"/>

                <path d="M12 28 H268" stroke="#c47a55" stroke-width="2" fill="none"/>
                <path d="M28 28 L40 52 H16 Z" fill="#ef6d8a"/>
                <path d="M58 28 L70 52 H46 Z" fill="#ffd15c"/>
                <path d="M88 28 L100 52 H76 Z" fill="#7ec8c3"/>
                <path d="M118 28 L130 52 H106 Z" fill="#c9a6ef"/>
                <path d="M148 28 L160 52 H136 Z" fill="#ff8fab"/>
                <path d="M178 28 L190 52 H166 Z" fill="#ffd15c"/>
                <path d="M208 28 L220 52 H196 Z" fill="#7ec8c3"/>
                <path d="M238 28 L250 52 H226 Z" fill="#ef6d8a"/>

                <g class="balloon">
                  <ellipse cx="34" cy="78" rx="15" ry="19" fill="#ff7d98"/>
                  <path d="M34 96 L31 102 H37 Z" fill="#ff7d98"/>
                  <path d="M34 102 C30 130 40 150 28 176" fill="none" stroke="#c47a55" stroke-width="1.4"/>
                  <ellipse cx="28" cy="70" rx="4" ry="7" fill="rgba(255,255,255,0.35)"/>
                </g>
                <g class="balloon balloon-b">
                  <ellipse cx="250" cy="72" rx="14" ry="18" fill="#ffd15a"/>
                  <path d="M250 89 L247 95 H253 Z" fill="#e6b63e"/>
                  <path d="M250 95 C258 124 244 150 258 176" fill="none" stroke="#c47a55" stroke-width="1.4"/>
                  <ellipse cx="244" cy="64" rx="3.5" ry="6" fill="rgba(255,255,255,0.4)"/>
                </g>
                <g class="balloon balloon-c">
                  <ellipse cx="248" cy="112" rx="9" ry="11" fill="#8fd0c8"/>
                  <path d="M248 122 L246 127 H250 Z" fill="#6eb8b0"/>
                  <path d="M248 127 C242 146 252 160 246 176" fill="none" stroke="#c47a55" stroke-width="1.2"/>
                </g>

                <circle cx="46" cy="188" r="4" fill="#ffd166" opacity="0.9"/>
                <circle cx="230" cy="196" r="3.5" fill="#ff8fab" opacity="0.85"/>
                <circle cx="150" cy="96" r="3" fill="#c9a6ef"/>
                <rect x="200" y="150" width="7" height="10" rx="1" fill="#ffd166" transform="rotate(18 200 150)"/>
                <rect x="70" y="120" width="6" height="9" rx="1" fill="#8fd0c8" transform="rotate(-20 70 120)"/>

                <!-- sister -->
                <g class="dancer dancer-sister">
                  <ellipse cx="86" cy="404" rx="26" ry="6" fill="rgba(90,50,30,0.13)"/>
                  <path d="M70 250 C58 300 60 360 68 396 H108 C114 360 112 300 102 248 Z" fill="#c9b0ea" stroke="#5c382f" stroke-width="2.2" stroke-linejoin="round"/>
                  <path d="M78 300 H98" stroke="#a88ad4" stroke-width="3" stroke-linecap="round"/>
                  <path d="M74 214 C62 236 58 258 64 276" fill="none" stroke="#ffd0b5" stroke-width="8" stroke-linecap="round"/>
                  <circle cx="62" cy="280" r="5.5" fill="#ffd0b5" stroke="#5c382f" stroke-width="1.6"/>
                  <path d="M98 214 C112 232 116 250 110 270" fill="none" stroke="#ffd0b5" stroke-width="8" stroke-linecap="round"/>
                  <circle cx="112" cy="274" r="5.5" fill="#ffd0b5" stroke="#5c382f" stroke-width="1.6"/>
                  <g transform="translate(112 262)">
                    <path d="M0 8 V26" stroke="#3e8f4e" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="0" cy="0" r="6" fill="#ff8fab"/>
                    <circle cx="-6" cy="4" r="5" fill="#fff"/>
                    <circle cx="6" cy="4" r="5" fill="#ffd6e0"/>
                    <circle cx="0" cy="2" r="2.6" fill="#ffd166"/>
                  </g>
                  <circle cx="86" cy="196" r="8" fill="#ffd0b5"/>
                  <path d="M62 214 C58 168 60 150 86 146 C114 150 116 172 110 214 C104 196 70 196 62 214 Z" fill="#4a2c32"/>
                  <circle cx="86" cy="188" r="21" fill="#ffd0b5" stroke="#5c382f" stroke-width="2.2"/>
                  <path d="M66 176 Q86 166 106 178" fill="none" stroke="#4a2c32" stroke-width="6" stroke-linecap="round"/>
                  <path d="M104 186 C118 196 124 230 116 268" fill="none" stroke="#4a2c32" stroke-width="8" stroke-linecap="round"/>
                  <circle cx="116" cy="176" r="6" fill="#ef6d8a"/>
                  <circle cx="78" cy="186" r="2.4" fill="#3a2a26"/>
                  <circle cx="96" cy="186" r="2.4" fill="#3a2a26"/>
                  <circle cx="79" cy="185" r="0.8" fill="#fff"/>
                  <circle cx="97" cy="185" r="0.8" fill="#fff"/>
                  <path d="M78 198 Q86 205 95 198" fill="none" stroke="#c45a62" stroke-width="1.8" stroke-linecap="round"/>
                  <ellipse cx="74" cy="194" rx="3.2" ry="2" fill="#ffb4a8" opacity="0.9"/>
                  <ellipse cx="100" cy="194" rx="3.2" ry="2" fill="#ffb4a8" opacity="0.9"/>
                  <ellipse cx="72" cy="396" rx="8" ry="4" fill="#8a6bb5"/>
                  <ellipse cx="102" cy="396" rx="8" ry="4" fill="#8a6bb5"/>
                </g>

                <!-- mom -->

  <script>
    (function () {
      "use strict";

      var RING_COUNT = 3;
      var RING_GAP = 1.5;
      var SILENCE = 1.0;
      var LOOPS = 3;
      var EIGHTH = 0.28;

      // Happy Birthday to You, public-domain melody in C major, one octave up.
      // sol sol la sol do ti | sol sol la sol re do | sol sol sol mi do ti la | fa fa mi do re do
      // Durations are in eighth notes. Phrase 1 ends on a semitone (leading tone).
      var MELODY = [
        ["G5", 1], ["G5", 1], ["A5", 2], ["G5", 2], ["C6", 2], ["B5", 4],
        ["G5", 1], ["G5", 1], ["A5", 2], ["G5", 2], ["D6", 2], ["C6", 4],
        ["G5", 1], ["G5", 1], ["G6", 2], ["E6", 2], ["C6", 2], ["B5", 2], ["A5", 4],
        ["F6", 1], ["F6", 1], ["E6", 2], ["C6", 2], ["D6", 2], ["C6", 4]
      ];

      var HARMONY = [
        "C", null, null, "C", "C", "G",
        "C", null, null, "C", "G", "C",
        "C", null, "C", "C", "Am", "G", "F",
        "F", null, "C", "C", "G", "C"
      ];

      var SEMI = {
        F3: -16, G3: -14, A3: -12, B3: -10,
        C4: -9, D4: -7, E4: -5, F4: -4, G4: -2, A4: 0, B4: 2,
        C5: 3, D5: 5, E5: 7, F5: 8, G5: 10, A5: 12, B5: 14,
        C6: 15, D6: 17, E6: 19, F6: 20, G6: 22
      };

      var CHORDS = {
        C: ["C4", "E4", "G4"],
        G: ["G3", "B3", "D4"],
        F: ["F3", "A3", "C4"],
        Am: ["A3", "C4", "E4"]
      };

      var app = document.getElementById("app");
      var startBtn = document.getElementById("start");
      var doorBtn = document.getElementById("door");
      var doorway = document.getElementById("doorway");
      var bell = document.getElementById("bell");
      var hint = document.getElementById("hint");
      var title = document.getElementById("title");
      var muteBtn = document.getElementById("mute");

      var phase = "start";
      var ctx = null;
      var master = null;
      var muted = false;
      var visualsArmed = false;

      function freq(name) {
        return 440 * Math.pow(2, SEMI[name] / 12);
      }

      function connectVoice(osc, gain, when, stop) {
        osc.connect(gain);
        gain.connect(master);
        osc.start(when);
        osc.stop(stop);
      }

      function strike(frequency, time, dur, volume) {
        var partials = [1, 2, 2.76];
        var amps = [1, 0.32, 0.16];
        for (var i = 0; i < partials.length; i++) {
          if (frequency * partials[i] > 4800) continue;
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(frequency * partials[i], time);
          var peak = Math.max(0.0002, volume * amps[i]);
          gain.gain.setValueAtTime(0.0001, time);
          gain.gain.exponentialRampToValueAtTime(peak, time + 0.008);
          gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);
          connectVoice(osc, gain, time, time + dur + 0.04);
        }
      }

      function playDingDong(time) {
        strike(freq("A5"), time, 0.24, 0.2);
        strike(freq("E5"), time + 0.17, 0.58, 0.18);
      }

      function playBox(frequency, time, dur) {
        var partials = [1, 2.71, 5.4];
        var amps = [0.62, 0.24, 0.1];
        var stop = time + Math.max(0.32, dur * 1.25);
        for (var i = 0; i < partials.length; i++) {
          if (frequency * partials[i] > 4600) continue;
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(frequency * partials[i], time);
          var peak = Math.max(0.0002, 0.16 * amps[i]);
          gain.gain.setValueAtTime(0.0001, time);
          gain.gain.exponentialRampToValueAtTime(peak, time + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, stop);
          connectVoice(osc, gain, time, stop + 0.03);
        }
      }

      function playChord(name, time, dur) {
        var notes = CHORDS[name];
        if (!notes) return;
        for (var i = 0; i < notes.length; i++) {
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq(notes[i]), time);
          gain.gain.setValueAtTime(0.0001, time);
          gain.gain.exponentialRampToValueAtTime(0.03, time + 0.06);
          gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);
          connectVoice(osc, gain, time, time + dur + 0.04);
        }
      }

      function songLength() {
        var beats = 0;
        for (var i = 0; i < MELODY.length; i++) beats += MELODY[i][1];
        return beats * EIGHTH;
      }

      function scheduleSong(startTime) {
        var t = startTime;
        for (var i = 0; i < MELODY.length; i++) {
          var dur = MELODY[i][1] * EIGHTH;
          playBox(freq(MELODY[i][0]), t, dur);
          if (HARMONY[i]) playChord(HARMONY[i], t, Math.max(dur * 1.15, EIGHTH * 3));
          t += dur;
        }
      }

      function shakeDoor() {
        doorway.classList.remove("is-shaking");
        bell.classList.remove("is-wiggling");
        void doorway.offsetWidth;
        doorway.classList.add("is-shaking");
        bell.classList.add("is-wiggling");
      }

      function showClosedDoor() {
        if (phase !== "ringing") return;
        phase = "closed";
        app.classList.remove("is-ringing");
        app.classList.add("is-closed");
        doorBtn.disabled = false;
      }

      function armVisuals(startAt) {
        if (visualsArmed) return;
        visualsArmed = true;
        var now = ctx ? ctx.currentTime : 0;
        var origin = ctx ? startAt : SILENCE;
        var base = ctx ? now : 0;
        for (var r = 0; r < RING_COUNT; r++) {
          var delay = (origin + r * RING_GAP - base) * 1000;
          window.setTimeout(shakeDoor, Math.max(0, delay));
        }
        var done = (origin + (RING_COUNT - 1) * RING_GAP + 0.95 - base) * 1000;
        window.setTimeout(showClosedDoor, Math.max(0, done));
      }

      function scheduleDoorbell() {
        var startAt = ctx.currentTime + SILENCE;
        for (var r = 0; r < RING_COUNT; r++) playDingDong(startAt + r * RING_GAP);
        armVisuals(startAt);
      }

      function unlockAudio() {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.85;
        master.connect(ctx.destination);
      }

      function begin() {
        if (phase !== "start") return;
        phase = "ringing";
        app.classList.remove("is-start");
        app.classList.add("is-ringing");
        try {
          unlockAudio();
        } catch (err) {
          ctx = null;
        }
        if (!ctx) {
          armVisuals(SILENCE);
          return;
        }
        var resumed = ctx.resume();
        var started = false;
        function go() {
          if (started) return;
          started = true;
          scheduleDoorbell();
        }
        if (resumed && resumed.then) resumed.then(go, function () { armVisuals(SILENCE); });
        else go();
        window.setTimeout(function () {
          if (!visualsArmed) armVisuals(SILENCE);
        }, 1500);
      }

      function openDoor() {
        if (phase !== "closed") return;
        phase = "open";
        app.classList.remove("is-closed");
        app.classList.add("is-open");
        doorBtn.disabled = true;
        title.setAttribute("aria-hidden", "false");
        if (!ctx) return;
        var startMusic = function () {
          var t = ctx.currentTime + 0.15;
          var length = songLength();
          for (var i = 0; i < LOOPS; i++) scheduleSong(t + i * (length + 0.85));
        };
        var resumed = ctx.resume();
        if (resumed && resumed.then) resumed.then(startMusic, startMusic);
        else startMusic();
      }

      function toggleMute() {
        muted = !muted;
        muteBtn.textContent = muted ? "🔇" : "🔊";
        muteBtn.setAttribute("aria-pressed", muted ? "true" : "false");
        muteBtn.setAttribute("aria-label", muted ? "Включить звук" : "Выключить звук");
        if (!ctx || !master) return;
        var now = ctx.currentTime;
        master.gain.cancelScheduledValues(now);
        master.gain.setValueAtTime(Math.max(0.0001, master.gain.value), now);
        master.gain.linearRampToValueAtTime(muted ? 0.0001 : 0.85, now + 0.05);
      }

      startBtn.addEventListener("click", begin);
      doorBtn.addEventListener("click", openDoor);
      hint.addEventListener("click", openDoor);
      muteBtn.addEventListener("click", toggleMute);
    })();
  </script>
</body>
</html>
